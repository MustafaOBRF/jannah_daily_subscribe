<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — يوميات مع الجنة</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#1f7a5a">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="authpage">
  <main class="authcard">
    <h1>يوميات مع الجنة</h1>
    <p class="sub">تسجيل دخول الأعضاء</p>
    <form id="loginform" novalidate>
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">تسجيل الدخول</button>
      <p class="forgotrow"><a href="#" id="forgot">نسيت كلمة المرور؟</a></p>
      <div class="msg" id="msg" role="status"></div>
    </form>
  </main>
  <script src="assets/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="assets/auth.js"></script>
  <script>initLogin();</script>
</body>
</html>
